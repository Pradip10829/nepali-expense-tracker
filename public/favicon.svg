      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background Rounded App Icon Tile -->
  <rect width="512" height="512" rx="120" fill="url(#grad)" />
  
  <!-- Outer Wallet Body -->
